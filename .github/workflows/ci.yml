name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older in-progress run on the same ref when a new commit
# lands. Saves CI minutes on rapid push cycles.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check (typecheck + lint, zero warnings)
        run: pnpm check

      - name: pnpm test
        run: pnpm test
