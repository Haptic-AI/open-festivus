name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Developer Certificate of Origin enforcement: every commit on every PR
# must carry a `Signed-off-by: Name <email>` trailer. Contributors add
# this automatically with `git commit -s`. See CONTRIBUTING.md for the
# full DCO text.
#
# This is a self-contained check, no third-party action dependency.
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          missing=""
          while read -r sha rest; do
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: '; then
              missing+="$sha $rest"$'\n'
            fi
          done < <(git log --no-merges --pretty=format:'%H %s' "${base}..${head}")

          if [ -n "$missing" ]; then
            echo "::error::Commits missing Signed-off-by trailer:"
            printf '%s\n' "$missing"
            echo ""
            echo "Fix: amend each commit with 'git commit --amend -s' (or 'git rebase -i' to amend several)."
            echo "DCO text: https://developercertificate.org/"
            exit 1
          fi
          echo "All commits have Signed-off-by."
