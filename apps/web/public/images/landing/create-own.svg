<svg width="200" height="110" viewBox="0 0 200 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="110" fill="#0B1C36"/>
  <!-- Blueprint grid -->
  <line x1="0" y1="22" x2="200" y2="22" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="0" y1="44" x2="200" y2="44" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="0" y1="66" x2="200" y2="66" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="0" y1="88" x2="200" y2="88" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="40" y1="0" x2="40" y2="110" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="80" y1="0" x2="80" y2="110" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="120" y1="0" x2="120" y2="110" stroke="#EFECE4" stroke-opacity="0.06"/>
  <line x1="160" y1="0" x2="160" y2="110" stroke="#EFECE4" stroke-opacity="0.06"/>
  <!-- Dashed robot outline -->
  <rect x="65" y="20" width="70" height="55" rx="8" stroke="#EFECE4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Robot head -->
  <circle cx="100" cy="35" r="10" stroke="#EFECE4" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Robot eyes -->
  <circle cx="96" cy="34" r="2" fill="#EFECE4" fill-opacity="0.15"/>
  <circle cx="104" cy="34" r="2" fill="#EFECE4" fill-opacity="0.15"/>
  <!-- Robot body -->
  <rect x="85" y="48" width="30" height="20" rx="4" stroke="#EFECE4" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Pencil cursor -->
  <g transform="translate(128, 58) rotate(-45)">
    <rect x="0" y="0" width="6" height="24" rx="1" fill="#FFD326" fill-opacity="0.8"/>
    <polygon points="0,24 3,30 6,24" fill="#FFD326" fill-opacity="0.8"/>
  </g>
  <!-- Plus icon -->
  <circle cx="100" cy="95" r="7" stroke="#FFD326" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="97" y1="95" x2="103" y2="95" stroke="#FFD326" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="100" y1="92" x2="100" y2="98" stroke="#FFD326" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
